replicaCount: 1

image:
  repository: localhost/etcd-v3-browser
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

etcd:
  # Optional: pre-fill the connection form with a default endpoint
  hosts: ""
  tls:
    enabled: false
    secretName: ""
    caCertKey: ca.crt
    clientCertKey: tls.crt
    clientKeyKey: tls.key

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: etcd-browser.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
