{{- if .Values.openshiftConsole.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "etcd-v3-browser.consolePatcherName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "etcd-v3-browser.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-delete
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "etcd-v3-browser.consolePatcherName" . }}
  labels:
    {{- include "etcd-v3-browser.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-delete
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
rules:
  - apiGroups: ["operator.openshift.io"]
    resources: ["consoles"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "etcd-v3-browser.consolePatcherName" . }}
  labels:
    {{- include "etcd-v3-browser.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-delete
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "etcd-v3-browser.consolePatcherName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "etcd-v3-browser.consolePatcherName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
