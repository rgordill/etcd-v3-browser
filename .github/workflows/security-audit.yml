name: Security Audit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: src
        run: npm ci

      - name: Audit backend dependencies
        id: backend-audit
        working-directory: src
        continue-on-error: true
        run: |
          OUTPUT=$(npm audit --production 2>&1)
          echo "$OUTPUT"
          EXIT_CODE=$?
          {
            echo "OUTPUT<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if echo "$OUTPUT" | grep -q "found 0 vulnerabilities"; then
            echo "HAS_VULNS=false" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_VULNS=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Audit frontend dependencies
        id: frontend-audit
        working-directory: src/frontend
        continue-on-error: true
        run: |
          OUTPUT=$(npm audit --production 2>&1)
          echo "$OUTPUT"
          EXIT_CODE=$?
          {
            echo "OUTPUT<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if echo "$OUTPUT" | grep -q "found 0 vulnerabilities"; then
            echo "HAS_VULNS=false" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_VULNS=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for vulnerabilities
        id: check
        run: |
          BACKEND_VULNS="${{ steps.backend-audit.outputs.HAS_VULNS }}"
          FRONTEND_VULNS="${{ steps.frontend-audit.outputs.HAS_VULNS }}"
          if [ "$BACKEND_VULNS" = "true" ] || [ "$FRONTEND_VULNS" = "true" ]; then
            echo "FOUND_VULNS=true" >> "$GITHUB_OUTPUT"
          else
            echo "FOUND_VULNS=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger upgrade-test workflow
        if: steps.check.outputs.FOUND_VULNS == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'upgrade-test.yml',
              ref: 'main'
            });
            console.log('Triggered upgrade-test workflow due to vulnerabilities found.');

      - name: Create vulnerability issue
        if: steps.check.outputs.FOUND_VULNS == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const title = `Security Vulnerabilities Detected - ${today}`;

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security,automated',
              state: 'open'
            });

            const alreadyReported = existingIssues.data.some(
              issue => issue.title.startsWith('Security Vulnerabilities Detected')
            );

            if (alreadyReported) {
              console.log('Open security issue already exists, skipping creation.');
              return;
            }

            let body = `## Security Audit Report - ${today}\n\n`;
            body += `Vulnerabilities were detected during the daily security audit.\n`;
            body += `The **upgrade-test** workflow has been triggered automatically.\n\n`;

            const backendOutput = `${{ steps.backend-audit.outputs.OUTPUT }}`;
            const frontendOutput = `${{ steps.frontend-audit.outputs.OUTPUT }}`;

            if ('${{ steps.backend-audit.outputs.HAS_VULNS }}' === 'true') {
              body += `### Backend (src/)\n\n\`\`\`\n${backendOutput.slice(-2000)}\n\`\`\`\n\n`;
            }
            if ('${{ steps.frontend-audit.outputs.HAS_VULNS }}' === 'true') {
              body += `### Frontend (src/frontend/)\n\n\`\`\`\n${frontendOutput.slice(-2000)}\n\`\`\`\n\n`;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              assignees: ['rgordill'],
              labels: ['security', 'automated']
            });

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.FOUND_VULNS }}" = "true" ]; then
            echo "::warning::Vulnerabilities found. Upgrade-test workflow triggered."
          else
            echo "No vulnerabilities found."
          fi
